name: monitoreo
description: App de Spring Telecom para técnicos instaladores (PWA, Android e iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fuente de CupertinoIcons: la usan widgets del framework (p. ej. la
  # barra de selección de texto en iOS y Safari).
  cupertino_icons: ^1.0.8

  # Gestión de estado
  provider: ^6.1.1
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  
  # HTTP requests (preparado para APIs REST)
  http: ^1.1.0
  
  # Utilidades
  equatable: ^2.0.5
  
  # Signature pad
  signature: ^5.4.0
  
  # Geolocalización
  geolocator: ^13.0.1
  
  # Alertas
  quickalert: ^1.0.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  http_parser: ^4.1.2
  image: ^4.12.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  # APIs del navegador para la versión web (descarga del PDF).
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  image_picker_platform_interface: ^2.11.2
  # Simulan el GPS en las pruebas de LocationService.
  geolocator_platform_interface: ^4.2.0
  # Controla el reloj en las pruebas de tiempos máximos.
  fake_async: ^1.3.0

flutter:
  uses-material-design: true

  # Imágenes que usa la app (el ícono de la app no va aquí: lo usa
  # flutter_launcher_icons).
  assets:
    - assets/images/logos/
    - assets/images/backgrounds/

# Configuración para generar iconos de la aplicación
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icons/icono_de_instalador.png"
  min_sdk_android: 21
  # Azul del fondo de la ilustración: rellena lo que el recorte de Android
  # (círculo, squircle) deje visible alrededor de la imagen.
  adaptive_icon_background: "#0B3FCF"
  adaptive_icon_foreground: "assets/images/icons/icono_de_instalador.png"
  # La ilustración ocupa todo el cuadro; el margen la lleva a la zona que el
  # launcher muestra para que no se recorten el técnico ni el auto.
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true  # Remueve transparencia para cumplir con App Store