name: monitoreo
description: Aplicación base Flutter con arquitectura limpia y escalable
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestión de estado
  provider: ^6.1.1
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  
  # HTTP requests (preparado para APIs REST)
  http: ^1.1.0
  
  # Utilidades
  equatable: ^2.0.5
  
  # Signature pad
  signature: ^5.4.0
  
  # Geolocalización
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  
  # Formateo de fechas
  intl: ^0.19.0
  
  # Alertas
  quickalert: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Assets (imágenes, iconos, etc.)
  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/logos/SPRING-HORIZONTAL.png
    - assets/images/logos/favicon.png
    - assets/images/backgrounds/
    - assets/images/backgrounds/bienvenida.jpg

# Configuración para generar iconos de la aplicación
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/favicon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logos/favicon.png"
  remove_alpha_ios: true  # Remueve transparencia para cumplir con App Store