<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!--
    `tool/build_web.sh` (con `--base-href`) reemplaza este valor. Debe
    empezar y terminar con "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Agenda y órdenes de servicio para técnicos instaladores de Spring Telecom.">
  <meta name="theme-color" content="#09081C">
  <meta name="color-scheme" content="dark">

  <!-- Instalación en iOS ("Agregar a inicio") -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Instaladores">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Instaladores Spring</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #09081C;
    }

    /* Pantalla de carga: se quita cuando Flutter dibuja el primer cuadro. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #09081C;
      transition: opacity 0.3s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    #splash .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #6FA8E8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation-duration: 2.5s; }
    }

    /* Aviso de versión nueva (lo muestra pwa.js). Va arriba, debajo de la
       barra del título (56 px), para no tapar la barra inferior de la app. */
    #update-banner {
      position: fixed;
      left: 16px;
      right: 16px;
      top: calc(64px + env(safe-area-inset-top, 0px));
      z-index: 1000;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px 12px 16px;
      border-radius: 14px;
      background: #1A1930;
      color: #FFFFFF;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    #update-banner[hidden] {
      display: none;
    }

    #update-banner span {
      flex: 1;
    }

    #update-banner button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #update-reload {
      background: #6FA8E8;
      color: #09081C;
    }

    #update-later {
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Cargando Instaladores Spring">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
  </div>

  <noscript>Para usar Instaladores Spring activa JavaScript en tu navegador.</noscript>

  <div id="update-banner" role="alert" hidden>
    <span>Hay una versión nueva de la app.</span>
    <button id="update-later" type="button">Después</button>
    <button id="update-reload" type="button">Recargar</button>
  </div>

  <script src="pwa.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
